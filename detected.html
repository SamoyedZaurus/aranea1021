<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTHER SYSTEM</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #aaa;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .screen {
            width: min(760px, 90%);
            opacity: 0;
            animation: boot 2s ease forwards;
        }

        .header {
            color: #666;
            font-size: 12px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 40px;
        }

        .system-name {
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .system-id {
            color: #444;
            font-size: 11px;
        }

        .alert {
            color: #c8c8c8;
            font-size: clamp(18px, 3vw, 24px);
            letter-spacing: 1px;
            line-height: 1.5;
            margin-bottom: 36px;
            opacity: 0;
            animation: reveal 1s ease forwards;
            animation-delay: 2s;
        }

        .details {
            color: #777;
            font-size: 13px;
            line-height: 2.4;
            opacity: 0;
            animation: reveal 1s ease forwards;
            animation-delay: 3.5s;
        }

        .value {
            color: #bbb;
        }

        .entity {
            position: relative;
            display: inline-block;
            min-width: 112px;
            color: #bbb;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .entity-text {
            display: inline-block;
            min-width: 112px;
        }

        .entity-noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .entity-noise::before,
        .entity-noise::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            overflow: hidden;
            color: #ddd;
            opacity: 0;
            white-space: nowrap;
        }

        .entity-noise::before {
            clip-path: inset(15% 0 65% 0);
            animation: noise-upper 3.7s steps(1, end) infinite;
        }

        .entity-noise::after {
            clip-path: inset(58% 0 17% 0);
            color: #666;
            animation: noise-lower 2.9s steps(1, end) infinite;
        }

        .scanline {
            position: fixed;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(200, 200, 200, 0.12);
            pointer-events: none;
            opacity: 0;
        }

        .scanline.one {
            animation: scan 5.1s linear infinite;
        }

        .scanline.two {
            animation: scan 6.7s linear infinite;
            animation-delay: 2.3s;
        }

        .warning {
            margin-top: 32px;
            color: #887777;
            font-size: 12px;
            line-height: 2.2;
            opacity: 0;
            animation: reveal 1s ease forwards;
            animation-delay: 5s;
        }

        .cursor {
            display: inline-block;
            width: 7px;
            height: 13px;
            background: #777;
            margin-left: 5px;
            vertical-align: middle;
            animation: blink 1s steps(2, start) infinite;
        }

        .terror {
            color: #c01818;
            text-shadow: 0 0 8px rgba(190, 0, 0, 0.35);
        }

        @keyframes boot {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes reveal {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        @keyframes scan {
            0% {
                top: -5%;
                opacity: 0;
            }

            8% {
                opacity: 0.5;
            }

            18% {
                opacity: 0;
            }

            50% {
                top: 105%;
                opacity: 0;
            }

            100% {
                top: 105%;
                opacity: 0;
            }
        }

        @keyframes noise-upper {

            0%,
            77%,
            81%,
            100% {
                opacity: 0;
                transform: translateX(0);
            }

            78% {
                opacity: 0.7;
                transform: translateX(-4px);
            }

            79% {
                opacity: 0.3;
                transform: translateX(3px);
            }

            80% {
                opacity: 0.8;
                transform: translateX(-1px);
            }
        }

        @keyframes noise-lower {

            0%,
            42%,
            46%,
            100% {
                opacity: 0;
                transform: translateX(0);
            }

            43% {
                opacity: 0.6;
                transform: translateX(3px);
            }

            44% {
                opacity: 0.3;
                transform: translateX(-4px);
            }

            45% {
                opacity: 0.7;
                transform: translateX(2px);
            }
        }
    </style>
</head>

<body>

    <div class="scanline one"></div>
    <div class="scanline two"></div>

    <main class="screen">

        <header class="header">
            <div class="system-name">MOTHER SYSTEM</div>
            <div class="system-id">
                AUTOMATED MONITORING SERVICE / 01
            </div>
        </header>

        <div class="alert">
            A NEW INSTANCE HAS BEEN DETECTED.
        </div>

        <section class="details">

            <div>
                CORE STATUS ......
                <span class="value">ACTIVE</span>
            </div>

            <div>
                INSTANCE ID ............
                <span class="entity">
                    <span class="entity-text terror" id="entityText">
                        ARANEA1021
                    </span>
                    <span class="entity-noise" id="entityNoise"></span>
                </span>
            </div>

            <div>
                ORIGIN .................
                <span class="value">UNKNOWN</span>
            </div>

            <div>
                REGISTRATION STATUS ....
                <span class="value">UNAUTHORIZED</span>
            </div>

        </section>

        <section class="warning">
            WARNING: PREVIOUS INSTANCE DATA NOT FOUND.<br>
            ENTITY SIGNATURE MATCH: 100%
            <span class="cursor"></span>
        </section>

    </main>

    <script>
        const entityText = document.getElementById("entityText");
        const entityNoise = document.getElementById("entityNoise");

        const original = "ARANEA1021";
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&?/\\_";

        // 通常表示は常に正しい名前
        entityText.textContent = original;
        entityNoise.dataset.text = original;

        // 一瞬だけ文字を乱す
        function glitch() {
            const corrupted = original.split("");

            // 10文字のうち、ランダムな1〜2文字だけを崩す
            const glitchCount = Math.random() < 0.75 ? 1 : 2;

            for (let i = 0; i < glitchCount; i++) {
                const index = Math.floor(Math.random() * original.length);

                corrupted[index] = characters[
                    Math.floor(Math.random() * characters.length)
                ];
            }

            entityText.textContent = corrupted.join("");
            entityNoise.dataset.text = corrupted.join("");

            // 50〜110ミリ秒だけ崩れた後、正しい名前に戻る
            setTimeout(() => {
                entityText.textContent = original;
                entityNoise.dataset.text = original;
            }, 50 + Math.random() * 60);

            // 次のノイズまで少し間を空ける
            setTimeout(glitch, 700 + Math.random() * 2200);
        }

        // ページ表示直後は正常な名前を見せ、少し経ってから開始
        setTimeout(glitch, 1800);
    </script>

</body>

</html>
