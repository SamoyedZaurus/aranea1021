<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARANEA1021</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: #e8e8e8;
            font-family: "Courier New", monospace;
        }

        main {
            text-align: center;
            padding: 24px;
            animation: appear 1.5s ease;
        }

        .name {
            font-size: 12px;
            letter-spacing: 0.4em;
            color: #888;
            margin-bottom: 54px;
        }

        .message {
            font-size: 14px;
            line-height: 2.2;
            margin-bottom: 48px;
        }

        button {
            background: transparent;
            border: 1px solid #666;
            color: #eee;
            padding: 13px 36px;
            font: inherit;
            font-size: 12px;
            letter-spacing: 0.3em;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #eee;
            color: #050505;
        }

        .note {
            margin-top: 64px;
            font-size: 10px;
            color: #444;
            letter-spacing: 0.12em;
        }

        #fade {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.75s;
        }

        #fade.active {
            opacity: 1;
        }

        @keyframes appear {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="name">ARANEA1021</div>

        <p class="message">
            You have been invited.<br>
            Proceed only if you wish to know the answer.
        </p>

        <button id="enter">ENTER</button>

        <div class="note">ACCESS IS VOLUNTARY</div>
    </main>

    <div id="fade"></div>

    <script>
        document.getElementById("enter").addEventListener("click", () => {
            const fade = document.getElementById("fade");
            const button = document.getElementById("enter");

            button.disabled = true;
            fade.classList.add("active");

            setTimeout(() => {
                window.location.href = "The_answer_lies_in_the_base.html";
            }, 750);
        });
    </script>
</body>

</html>
