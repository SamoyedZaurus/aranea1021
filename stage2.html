<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1021</title>

  <style>
    :root {
      color-scheme: dark;
      background: #000;
      color: #fff;
      font-family: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
    }

    main {
      width: min(92vw, 700px);
      padding: 40px 24px;
      text-align: center;
    }

    .code {
      margin: 0;
      font-size: clamp(1.2rem, 4.5vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      line-height: 1.8;
      overflow-wrap: anywhere;
      user-select: text;
    }

    @media (max-width: 400px) {
      .code {
        letter-spacing: 0.04em;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="code">89 48 8C 8E 92 AC</p>
  </main>
</body>

</html>
